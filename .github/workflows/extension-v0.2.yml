name: Extension v0.2 archive regression
on:
  pull_request:
    paths:
      - 'extension/**'
      - 'tests/extension-v0.2.test.cjs'
      - '.github/workflows/extension-v0.2.yml'
  workflow_dispatch:
jobs:
  archive-fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/extension-v0.2.test.cjs
      - name: Package installable Avast / Chromium extension
        run: |
          cd extension
          zip -q -r ../copilot-avast-extension-v0.2-terminal-fix.zip .
          unzip -t ../copilot-avast-extension-v0.2-terminal-fix.zip
      - name: Publish tested extension package
        uses: actions/upload-artifact@v4
        with:
          name: copilot-avast-extension-v0.2-terminal-fix
          path: copilot-avast-extension-v0.2-terminal-fix.zip
          if-no-files-found: error
          retention-days: 30
