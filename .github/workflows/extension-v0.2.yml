name: Extension v0.2 archive regression
on:
  pull_request:
    paths:
      - 'extension/**'
      - 'tests/extension-v0.2.test.cjs'
      - '.github/workflows/extension-v0.2.yml'
  workflow_dispatch:
jobs:
  archive-fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/extension-v0.2.test.cjs
